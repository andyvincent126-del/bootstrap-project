<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now - Vincent's Cut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-rulrWoWv9A0FGEH9dgw3RfOe9ZmxqtW30nMsM7l7jSS9hgo2snzUBQ&s" alt="Vincent's cut">
        </div>
        <a href="index.html" class="btn">Back Home</a>
    </header>

    <section class="hero">
        <h1>Book Your Cut</h1>
        <p>Fast booking for Lekki branch</p>
    </section>

    <section style="max-width:500px; margin:0 auto; padding:20px;">
        <form id="bookingForm" style="display:flex; flex-direction:column; gap:12px; background:#1a1a1a; padding:25px; border-radius:10px; border:1px solid rgb(175,131,0);">
            <label style="color:blanchedalmond;">Full Name</label>
            <input type="text" id="name" required placeholder="Vincent James" style="padding:12px; border-radius:5px; border:none;">
            
            <label style="color:blanchedalmond;">Phone</label>
            <input type="tel" id="phone" required placeholder="080..." style="padding:12px; border-radius:5px; border:none;">
            
            <label style="color:blanchedalmond;">Select Style</label>
            <select id="style" style="padding:12px; border-radius:5px;">
                <option>Skin Fade - ₦5,000</option>
                <option>Low Cut - ₦3,000</option>
                <option>Beard Trim - ₦2,000</option>
                <option>Dreadlocks - ₦15,000</option>
                <option>Galaxy - ₦10,000</option>
                <option>Taper Fade - ₦6,000</option>
                <option>Hair Dye - ₦7,000</option>
            </select>

            <label style="color:blanchedalmond;">Select Dye Color</label>
            <select id="dyeColor" style="padding:12px; border-radius:5px;">
                <option value="No Dye">No Dye - Just Cut</option>
                <option>Black</option>
                <option>Blonde / Gold - ₦2,000 extra</option>
                <option>Brown / Chestnut - ₦2,000 extra</option>
                <option>Red / Burgundy - ₦3,000 extra</option>
                <option>Blue - ₦3,000 extra</option>
                <option>Green - ₦3,000 extra</option>
                <option>Platinum White - ₦4,000 extra</option>
                <option>Galaxy Multi-Color - ₦5,000 extra</option>
            </select>

            <label style="color:blanchedalmond;">Date</label>
            <input type="date" id="date" required style="padding:12px; border-radius:5px;">

            <button type="submit" class="btn" style="border:none; cursor:pointer; margin-top:10px;">Confirm Booking</button>
        </form>

        <div id="successBox" style="display:none; text-align:center; background:#1a1a1a; padding:30px; border-radius:10px; border:2px solid rgb(175,131,0); margin-top:20px;">
            <h2 style="color:rgb(175,131,0); font-size:40px;">✓</h2>
            <h2 style="color:blanchedalmond;">Booking Successful!</h2>
            <p style="color:blanchedalmond; font-size:18px; margin-top:15px;">Don't miss your appointment 👍</p>
            <p id="details" style="color:rgb(175,131,0); margin-top:15px;"></p>
            <br>
            <a href="index.html" class="btn">Back to Home</a>
        </div>
    </section>

    <script>
        const form = document.getElementById('bookingForm');
        const successBox = document.getElementById('successBox');
        const details = document.getElementById('details');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const style = document.getElementById('style').value;
            const dyeColor = document.getElementById('dyeColor').value;
            const date = document.getElementById('date').value;

            form.style.display = 'none';
            successBox.style.display = 'block';
            
            if(dyeColor === 'No Dye'){
                details.innerHTML = `Thanks <b>${name}</b>! You booked <b>${style}</b> for <b>${date}</b>.`;
            } else {
                details.innerHTML = `Thanks <b>${name}</b>! You booked <b>${style}</b> + <b>${dyeColor} Dye</b> for <b>${date}</b>.`;
            }
        });
    </script>
</body>
</html>
